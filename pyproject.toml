[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "capacious"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "datasets==5.1.0",
    "huggingface-hub==1.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
