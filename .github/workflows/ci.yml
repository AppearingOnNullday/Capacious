name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q

  sut-host-integration:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Run SUT host setup
        run: bash scripts/env_setup/setup_sut_host.sh --grant-docker-access

      - name: Run SUT host preflight
        run: python3 scripts/env_setup/preflight_sut_host.py

      - name: Docker smoke test
        run: docker run --rm alpine:3.20 true